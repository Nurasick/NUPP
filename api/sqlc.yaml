# sqlc reads our SQL schema (the migrations) and our queries, checks them
# against each other, and generates type-safe Go code. A typo in a column name
# becomes a generation error instead of a runtime error.
#
# Regenerate after changing a migration or queries.sql (from the api/ folder):
#   docker run --rm -v "${PWD}:/src" -w /src sqlc/sqlc:1.29.0 generate
version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations # sqlc understands goose's Up/Down markers
    queries: internal/catalog/queries.sql
    gen:
      go:
        package: catalogdb
        out: internal/catalog/catalogdb
        sql_package: pgx/v5
        # Nullable columns become Go pointers (*string, *int32), so NULL is nil
        # and json.Marshal writes null — exactly the API's rule R-API-9.
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
